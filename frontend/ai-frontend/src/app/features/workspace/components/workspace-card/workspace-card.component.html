<div
  class="rounded-lg overflow-hidden shadow-lg border bg-white hover:shadow-lg w-full">
    <!-- Thumbnail -->
    @if (workspace.thumbnail) {

      <img
        [src]="workspace.thumbnail"
        [alt]="workspace.name"
        class="h-60 object-cover w-full"
        loading="lazy"
      />
  
    } @else {
  
      <div class="h-60 w-full bg-gray-200 flex items-center justify-center">
        
        <div class="flex flex-col items-center text-gray-500">
  
          <!-- Folder Icon -->
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-16 h-16"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="1.5"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M3 7.5A1.5 1.5 0 014.5 6h4.379a1.5 1.5 0 011.06.44l1.121 1.12a1.5 1.5 0 001.06.44H19.5A1.5 1.5 0 0121 9.5v8A1.5 1.5 0 0119.5 19h-15A1.5 1.5 0 013 17.5v-10z"
            />
          </svg>
  
          <p class="text-sm mt-2">No Thumbnail</p>
  
        </div>
      </div>
  
    }
  

    <div class="p-4">

      <!-- Top Row -->
      <div class="flex items-start justify-between gap-2">
  
        <h3 class="font-semibold text-base line-clamp-1">
          {{ workspace.name }}
        </h3>
  
        <span
          class="text-[11px] px-2 py-1 rounded-full whitespace-nowrap"
          [class.bg-green-100]="workspace.isPublic"
          [class.text-green-700]="workspace.isPublic"
          [class.bg-gray-100]="!workspace.isPublic"
          [class.text-gray-600]="!workspace.isPublic"
        >
          {{ workspace.isPublic ? 'Public' : 'Private' }}
        </span>
  
      </div>
  
      <!-- Description -->
      <p class="text-sm text-gray-500 mt-2 line-clamp-2">
        {{ workspace.description }}
      </p>
  
    </div>
</div>
